name: Verify PCBL Arcade source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete Arcade assets and tags
        run: |
          node scripts/verify.mjs
          test "$(find site -type f | wc -l)" -ge 234
          node --check site/app.js
          node --check site/world-url.js
