name: Publish PCBL WORLD thumbnail
on:
  push:
    paths:
      - scripts/render-world-promo.py
      - .github/workflows/publish-world-promo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/render-world-promo.py
      - name: Validate thumbnail output
        run: |
          test -s site/assets/pcbl-world-cinematic-banner.jpg
          test -s site/assets/pcbl-world-cinematic-card.jpg
          node scripts/verify.mjs
      - name: Commit generated images for Cloudflare Git integration
        run: |
          git config user.name "PCBL Artwork"
          git config user.email "actions@users.noreply.github.com"
          git add site/assets/pcbl-world-cinematic-banner.jpg site/assets/pcbl-world-cinematic-card.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Publish cinematic PCBL WORLD artwork"
          git push origin HEAD:main
